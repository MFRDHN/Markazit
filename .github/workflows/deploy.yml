name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ════════════════════════════════════════════════════
  # CHECK: PHP syntax + Laravel static analysis
  # ════════════════════════════════════════════════════
  backend-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: markazit_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, zip

      - name: Wait for MySQL
        run: until mysqladmin ping -h 127.0.0.1 -u root -proot; do sleep 1; done

      - name: Validate composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Create .env.testing
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=markazit_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env.testing

      - name: Run tests
        run: php artisan test --env=testing
        env:
          APP_ENV: testing

  # ════════════════════════════════════════════════════
  # CHECK: Frontend build
  # ════════════════════════════════════════════════════
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ════════════════════════════════════════════════════
  # DEPLOY: to production (push to main only)
  # ════════════════════════════════════════════════════
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install backend deps
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader

      - name: Deploy via Rsync
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          SOURCE: ./
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: -avz --delete --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='vendor' --exclude='.env' --exclude='docker-compose.yml'
          SCRIPT_BEFORE: |
            mkdir -p ${{ secrets.DEPLOY_PATH }}
          SCRIPT_AFTER: |
            cd ${{ secrets.DEPLOY_PATH }}/backend
            php artisan migrate --force
            php artisan optimize
            php artisan storage:link --force
