version: "3.9"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: false
  APP_URL: "${APP_URL:-http://localhost}"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: markazit
  DB_USERNAME: markazit
  DB_PASSWORD: "${DB_PASSWORD:-secret}"
  FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"

services:
  # ─── Laravel (PHP-FPM + Nginx) ──────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      <<: *app-env
    volumes:
      - .:/app
      - storage_data:/app/backend/storage
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ─── MySQL ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: markazit
      MYSQL_USER: markazit
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Node (Vite Dev Server) ────────────────────────
  node:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost/api
    restart: unless-stopped

volumes:
  mysql_data:
  storage_data:
