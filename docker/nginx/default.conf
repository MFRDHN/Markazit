server {
    listen 80;
    server_name localhost;
    root /app/backend/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Storage (served from storage/app/public)
    location /storage/ {
        alias /app/backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Built frontend assets (production)
    location /assets/ {
        alias /app/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(css|js|gif|ico|png|jpg|jpeg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
